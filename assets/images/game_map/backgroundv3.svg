  <path d="M0 414 Q125 250 252 405 Q365 226 492 404 Q615 264 744 410 Q845 300 942 404 V635 H0Z" fill="#75B888"/>
  <path d="M0 481 Q120 359 232 472 Q355 333 466 474 Q594 351 706 477 Q825 371 942 468 V680 H0Z" fill="#91C98C"/>
  <path d="M0 596 Q170 493 332 584 Q500 474 666 589 Q816 491 942 575 V760 H0Z" fill="#A7D694"/>
  <path d="M0 660 Q205 565 417 649 Q640 554 942 655 V1674 H0Z" fill="url(#ground)"/>

  <!-- pale winding path, kept behind interface -->
  <path d="M438 1674 C455 1515 579 1436 532 1289 C486 1145 395 1068 430 930 C455 829 535 750 515 650 L630 650 C653 783 569 865 562 955 C551 1084 658 1156 661 1293 C665 1478 574 1555 588 1674Z" fill="url(#path)" opacity=".82"/>
  <path d="M488 1640 C523 1524 599 1450 579 1328" fill="none" stroke="#D7B76F" stroke-width="8" stroke-linecap="round" opacity=".24"/>

  <!-- simplified tree trunks framing the screen -->
