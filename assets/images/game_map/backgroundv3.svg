<svg xmlns="http://www.w3.org/2000/svg" width="942" height="1674" viewBox="0 0 942 1674" role="img" aria-labelledby="title desc">
  <title id="title">Tudlo Grade 1 soft cartoon forest background</title>
  <desc id="desc">Portrait mobile background with a pale sky, rounded forest canopy, distant hills, soft bushes, flowers and a winding path. No interface, text, or characters.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFEAFF"/>
      <stop offset="0.48" stop-color="#E8F8E8"/>
      <stop offset="1" stop-color="#D6EDAE"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BEE987"/>
      <stop offset="1" stop-color="#88CB62"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E7AF"/>
      <stop offset="1" stop-color="#E9CA82"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B633F"/>
      <stop offset="0.52" stop-color="#C78650"/>
      <stop offset="1" stop-color="#865335"/>
    </linearGradient>
    
  </defs>

  <!-- calm base -->
  <rect width="942" height="1674" fill="url(#sky)"/>
  <circle cx="750" cy="136" r="78" fill="#FFF3A7" opacity=".75"/>
