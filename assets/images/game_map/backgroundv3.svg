  <!-- subtle grass marks -->
  <g fill="none" stroke="#66B94D" stroke-width="8" stroke-linecap="round" opacity=".7">
    <path d="M181 1195 q-8-22-22-33 M181 1195 q7-27 23-41 M749 1161 q-8-22-21-35 M749 1161 q8-27 26-41"/>
    <path d="M264 1547 q-8-23-22-35 M264 1547 q8-28 24-40 M690 1494 q-8-24-22-35 M690 1494 q8-27 24-40"/>
