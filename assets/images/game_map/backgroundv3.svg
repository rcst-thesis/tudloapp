    <g transform="translate(848 1238)"><circle r="13" fill="#FFD64B"/><g fill="#FF92B6"><circle cy="-24" r="15"/><circle cx="23" cy="-7" r="15"/><circle cx="14" cy="19" r="15"/><circle cx="-14" cy="19" r="15"/><circle cx="-23" cy="-7" r="15"/></g><circle r="10" fill="#F6C63E"/></g>
