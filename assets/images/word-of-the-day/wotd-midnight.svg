<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Tudlo Midnight homepage background</title>
  <desc id="desc">Detailed portrait cartoon room background for the Tudlo Grade 1 homepage at midnight, without characters, interface, or text.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#243D4D"/><stop offset="1" stop-color="#152B39"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071A37"/><stop offset=".58" stop-color="#122D50"/><stop offset="1" stop-color="#263F5E"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#314956"/><stop offset="1" stop-color="#1B303C"/></linearGradient>
    <radialGradient id="rug"><stop stop-color="#435D45"/><stop offset="1" stop-color="#2C4437"/></radialGradient>
    <radialGradient id="light"><stop stop-color="#FFF4B5" stop-opacity=".72"/><stop offset="1" stop-color="#FFF4B5" stop-opacity="0"/></radialGradient>
    
    <clipPath id="arch"><path d="M200 705V360c0-210 150-286 340-286s340 76 340 286v345z"/></clipPath>
    <pattern id="leafPattern" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M30 98q42-59 81-17-46 58-81 17zM75 44q24-33 46-9-26 31-46 9z" fill="#173F4B" opacity=".075"/>
    </pattern>
  </defs>

  <!-- room shell -->
  <rect width="1080" height="1920" fill="url(#wall)"/>
  <rect width="1080" height="980" fill="url(#leafPattern)"/>
  <path d="M0 0h1080v54H0z" fill="#3F302A" opacity=".92"/>
  <path d="M0 54h1080v24H0z" fill="#5C4438" opacity=".72"/>
  <path d="M0 690h1080v1230H0z" fill="url(#floor)"/>
  <path d="M0 676h1080v42H0z" fill="#3F302A" opacity=".78"/>

  <!-- wide arched window and outdoor scene -->
  <path d="M168 735V356C168 122 337 42 540 42s372 80 372 314v379z" fill="#3F302A"/>
  <path d="M194 710V360c0-214 151-290 346-290s346 76 346 290v350z" fill="#F8F3DF"/>
  <g clip-path="url(#arch)">
    <rect x="190" y="60" width="700" height="670" fill="url(#sky)"/>
    
        <g fill="#FFF7C8" opacity=".95">
          <circle cx="260" cy="230" r="5"/><circle cx="342" cy="330" r="4"/><circle cx="430" cy="190" r="6"/>
          <circle cx="590" cy="312" r="4"/><circle cx="675" cy="185" r="5"/><circle cx="815" cy="390" r="4"/>
          <path d="M306 155l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
          <path d="M706 350l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
        </g>
    <path d="M570 162a70 70 0 1 0 58 108 78 78 0 0 1-58-108z" fill="#F2F0CC"/>
    <g fill="#FFF" opacity=".22">
      <circle cx="330" cy="315" r="39"/><circle cx="378" cy="287" r="60"/><circle cx="438" cy="320" r="44"/><rect x="292" y="319" width="190" height="42" rx="21"/>
      <circle cx="664" cy="430" r="30"/><circle cx="701" cy="408" r="46"/><circle cx="751" cy="434" r="34"/><rect x="640" y="433" width="144" height="33" rx="16"/>
    </g>
    <path d="M120 650Q290 398 454 610Q596 382 756 606Q852 474 980 625V760H120Z" fill="#263B50"/>
    <path d="M90 700Q260 535 421 676Q583 500 744 680Q865 550 990 688V790H90Z" fill="#1A333B"/>
    <g fill="#102E2C">
      <circle cx="250" cy="626" r="50"/><circle cx="292" cy="605" r="69"/><circle cx="344" cy="635" r="51"/><rect x="288" y="632" width="22" height="90" rx="11"/>
      <circle cx="760" cy="622" r="52"/><circle cx="810" cy="595" r="72"/><circle cx="859" cy="635" r="53"/><rect x="806" y="629" width="23" height="95" rx="11"/>
    </g>
    <path d="M90 710q182-70 360 6t370 0q80-30 170 7v120H90z" fill="#A8D784" opacity=".88"/>
  </g>
  <path d="M540 74v636M194 430h692" fill="none" stroke="#F8F3DF" stroke-width="28"/>
  <path d="M540 86v618M208 430h664" fill="none" stroke="#5C4438" stroke-width="7" opacity=".34"/>
  <path d="M212 365c20-165 134-246 268-270" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity=".28"/>

  <!-- hanging lamp and warm pool of light -->
  <ellipse cx="540" cy="630" rx="250" ry="120" fill="url(#light)" opacity=".18"/>
  <path d="M540 0v126" stroke="#3F302A" stroke-width="15"/>
  <path d="M438 172q102-116 204 0z" fill="#FFE58B" stroke="#3F302A" stroke-width="8"/>
  <ellipse cx="540" cy="173" rx="104" ry="25" fill="#FFF4B5"/>
  <path d="M475 198q65 72 130 0" fill="none" stroke="#FFF4B5" stroke-width="18" stroke-linecap="round" opacity=".45"/>

  <!-- decorative side pictures -->
  <g>
    <rect x="18" y="240" width="92" height="126" rx="19" fill="#FFF9E9" stroke="#5C4438" stroke-width="9"/>
    <path d="M39 337q18-61 47 0z" fill="#435D45"/><circle cx="67" cy="281" r="16" fill="#F2F0CC"/>
    <rect x="970" y="275" width="92" height="126" rx="19" fill="#FFF9E9" stroke="#5C4438" stroke-width="9"/>
    <path d="M991 369q23-73 48 0z" fill="#263B50"/><path d="M1008 326q11-33 22 0z" fill="#173F4B"/>
  </g>

  <!-- floor planks -->
  <g fill="none" stroke="#3F302A" stroke-width="7" opacity=".18">
    <path d="M0 930h1080M0 1170h1080M0 1410h1080M0 1650h1080"/>
    <path d="M190 690v240M670 690v240M390 930v240M860 930v240M145 1170v240M600 1170v240M330 1410v240M815 1410v240M120 1650v270M570 1650v270"/>
  </g>

  <!-- large leaf rug, center kept calm for UI -->
  <ellipse cx="540" cy="875" rx="350" ry="135" fill="url(#rug)" stroke="#D5E7A7" stroke-width="12" opacity=".86"/>
  <path d="M540 758q35 63 0 236M540 865q-108-52-220-40M540 865q106-53 224-40M540 922q-88 10-150 42M540 922q87 10 153 43" fill="none" stroke="#B8D98A" stroke-width="13" stroke-linecap="round" opacity=".58"/>

  <!-- left rounded bookcase -->
  <g transform="translate(0 101) scale(.58)">
    <rect x="44" y="1015" width="255" height="500" rx="38" fill="#5C4438" stroke="#3F302A" stroke-width="12"/>
    <rect x="70" y="1050" width="203" height="150" rx="19" fill="#F8E4BD"/>
    <rect x="70" y="1224" width="203" height="150" rx="19" fill="#F8E4BD"/>
    <rect x="70" y="1399" width="203" height="84" rx="20" fill="#3F302A"/>
    <g>
      <rect x="91" y="1090" width="27" height="91" rx="5" fill="#EF6E63"/><rect x="122" y="1070" width="32" height="111" rx="5" fill="#4D94D3"/>
      <rect x="159" y="1101" width="28" height="80" rx="5" fill="#F2BE3F"/><rect x="192" y="1083" width="35" height="98" rx="5" fill="#6EBB69"/>
      <rect x="93" y="1262" width="73" height="83" rx="12" fill="#5BA8D4"/><circle cx="129" cy="1284" r="8" fill="#DDF3FF"/>
      <path d="M191 1338l31-73 31 73z" fill="#EF8D46"/><circle cx="221" cy="1290" r="14" fill="#FFD865"/>
    </g>
    <circle cx="170" cy="1441" r="9" fill="#FFE58B"/>
  </g>

  <!-- right cabinet and plants -->
  <g transform="translate(465 17) scale(.58)">
    <rect x="768" y="1160" width="270" height="310" rx="38" fill="#5C4438" stroke="#3F302A" stroke-width="12"/>
    <path d="M781 1262h244M903 1172v286" stroke="#3F302A" stroke-width="9" opacity=".55"/>
    <circle cx="888" cy="1338" r="9" fill="#FFE58B"/><circle cx="920" cy="1338" r="9" fill="#FFE58B"/>
    <rect x="823" y="1086" width="150" height="92" rx="23" fill="#F3D098"/>
    <path d="M899 1098q-55-91-102-25 75 58 102 25zM899 1103q47-112 94-38-57 66-94 38zM901 1092q-8-128-65-87 8 89 65 87z" fill="#4E9D58"/>
    <path d="M898 1093v70" stroke="#3A7A47" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- side leaves and flowers removed for a cleaner interface background -->

  <!-- lower floor intentionally left clear for homepage cards and navigation -->
</svg>

